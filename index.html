<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96x96.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <meta name="theme-color" content="#9c6fe4">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div id="clock-block">
    <div id="clock">00:00:00</div>
    <div id="date"></div>
  </div>
</header>

<!-- ── Links — rendered from script.js, edit with ✎ ── -->
<div class="card" id="links-card">
  <div class="card-header">
    <div class="card-title">Links</div>
    <div class="card-actions">
      <button id="links-reset" title="Reset links to defaults">reset</button>
      <button id="links-edit-toggle" title="Edit links">✎</button>
    </div>
  </div>
  <div id="links-grid"></div>
  <form id="add-link-form" autocomplete="off">
    <input id="add-url" type="text" placeholder="Paste URL…" spellcheck="false">
    <input id="add-name" type="text" placeholder="Name (optional)" spellcheck="false">
    <button type="submit">Add</button>
  </form>
</div>

<!-- ── Hacker News ── -->
<div class="card" id="news-card">
  <div class="card-title">Hacker News</div>
  <div id="news-list">
    <div class="news-status">Loading…</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
